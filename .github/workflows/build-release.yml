name: Build Windows installer and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Resolve Windows packaging tools
        shell: pwsh
        run: |
          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe was not found after installation." }

          $mt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\mt.exe" -File |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $mt) { throw "The Windows SDK Manifest Tool was not found." }

          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MT_PATH=$($mt.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run cross-platform contract checks
        shell: pwsh
        run: |
          python .\packaging\build\Test-StaticContract.py --agent1-root .
          bash .\scripts\validate-source.sh

      - name: Select package version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = "1.0.1.$env:GITHUB_RUN_NUMBER"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') { throw "Invalid package version: $version" }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify committed NuGet lock files
        shell: pwsh
        run: |
          $projects = @(
            '.\src\WindowsSshEnabler.Core\WindowsSshEnabler.Core.csproj',
            '.\src\WindowsSshEnabler\WindowsSshEnabler.csproj',
            '.\tests\WindowsSshEnabler.Tests\WindowsSshEnabler.Tests.csproj',
            '.\tools\WindowsSshEnabler.DismProbe\WindowsSshEnabler.DismProbe.csproj'
          )
          foreach ($project in $projects) {
            dotnet restore $project --runtime win-x64 --locked-mode
            if ($LASTEXITCODE -ne 0) { throw "Locked restore failed: $project" }
          }
          foreach ($project in $projects) {
            dotnet restore $project --runtime win-x64 --force-evaluate
            if ($LASTEXITCODE -ne 0) { throw "Lock evaluation failed: $project" }
          }
          $locks = @(
            '.\src\WindowsSshEnabler.Core\packages.lock.json',
            '.\src\WindowsSshEnabler\packages.lock.json',
            '.\tests\WindowsSshEnabler.Tests\packages.lock.json',
            '.\tools\WindowsSshEnabler.DismProbe\packages.lock.json'
          )
          git diff -- $locks
          git diff --quiet --exit-code -- $locks
          if ($LASTEXITCODE -ne 0) { throw "Committed NuGet lock files are stale. Commit the generated lock-file changes." }

      - name: Build solution, run tests, and publish native probe
        shell: pwsh
        run: .\scripts\windows-build-test.ps1

      - name: Build and validate unsigned installer
        shell: pwsh
        run: |
          .\packaging\build\Build-Package.ps1 `
            -SourceRoot $PWD `
            -Version "${{ steps.version.outputs.value }}" `
            -PublisherName "25xr7yrs2y-oss" `
            -IsccPath "$env:ISCC_PATH" `
            -MtPath "$env:MT_PATH"

      - name: Upload versioned release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ steps.version.outputs.value }}
          if-no-files-found: error
          path: |
            packaging/artifacts/WindowsSshEnabler-Setup-${{ steps.version.outputs.value }}-x64.exe
            packaging/artifacts/SHA256SUMS.txt
            packaging/artifacts/artifact-inventory.json

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out release metadata
        uses: actions/checkout@v7

      - name: Select release version
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Release tags must use vMAJOR.MINOR.PATCH: $env:GITHUB_REF_NAME" }
          $notes = ".github\release-notes-$($env:GITHUB_REF_NAME).md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) { throw "Release notes are missing: $notes" }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "notes=$notes" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Download validated release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets-${{ steps.version.outputs.value }}
          path: release-assets

      - name: Create GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            ".\release-assets\WindowsSshEnabler-Setup-${{ steps.version.outputs.value }}-x64.exe#WindowsSshEnabler-Setup-${{ steps.version.outputs.value }}-x64.exe" `
            ".\release-assets\SHA256SUMS.txt#SHA256SUMS.txt" `
            ".\release-assets\artifact-inventory.json#artifact-inventory.json" `
            --verify-tag `
            --prerelease `
            --title "Windows SSH Enabler ${{ steps.version.outputs.value }} (Unsigned)" `
            --notes-file "${{ steps.version.outputs.notes }}"
