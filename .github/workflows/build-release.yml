name: Build Windows installer and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Resolve Windows packaging tools
        shell: pwsh
        run: |
          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe was not found after installation." }

          $mt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\mt.exe" -File |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $mt) { throw "The Windows SDK Manifest Tool was not found." }

          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MT_PATH=$($mt.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run cross-platform contract checks
        shell: pwsh
        run: |
          python .\packaging\build\Test-StaticContract.py --agent1-root .
          bash .\scripts\validate-source.sh

      - name: Select package version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = "1.0.0.$env:GITHUB_RUN_NUMBER"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') { throw "Invalid package version: $version" }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build and validate unsigned installer
        shell: pwsh
        run: |
          .\packaging\build\Build-Package.ps1 `
            -SourceRoot $PWD `
            -Version "${{ steps.version.outputs.value }}" `
            -PublisherName "25xr7yrs2y-oss" `
            -IsccPath "$env:ISCC_PATH" `
            -MtPath "$env:MT_PATH"

      - name: Create GitHub prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            ".\packaging\artifacts\WindowsSshEnabler-Setup-x64.exe#WindowsSshEnabler-Setup-x64.exe" `
            ".\packaging\artifacts\SHA256SUMS.txt#SHA256SUMS.txt" `
            ".\packaging\artifacts\artifact-inventory.json#artifact-inventory.json" `
            --verify-tag `
            --prerelease `
            --title "Windows SSH Enabler 1.0.0 (Unsigned)" `
            --notes-file ".github\release-notes-v1.0.0.md"
